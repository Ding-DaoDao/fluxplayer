name: Publish Flux Player Release APK

on:
  push:
    branches: [codex/release-grid-list-fix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluxplayer-release-grid-list-fix
  cancel-in-progress: true

env:
  RELEASE_SIGNING: production
  RELEASE_TAG: v0.16.5

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['RELEASE_SIGNING'] == 'production':
              names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
              missing = [name for name in names if not os.environ.get(name)]
              if missing:
                  raise SystemExit('Missing release signing secrets: ' + ', '.join(missing))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build optimized Release APK and test JDR engine
        run: gradle --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.util.concurrent.ForkJoinPool.common.parallelism=4' -I .github/ci-repositories.gradle :core:jdr-engine:test :app:assembleRelease
      - name: Sign Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release
          if [ "$RELEASE_SIGNING" = production ]; then
            python3 - <<'PY'
          import base64, os, pathlib
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing release signing secrets: ' + ', '.join(missing))
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fluxplayer-release.keystore'
          key.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          PY
            KEYSTORE="$RUNNER_TEMP/fluxplayer-release.keystore"
            trap 'rm -f "$KEYSTORE"' EXIT
            APK_NAME=FluxPlayer-0.16.5-arm64-v8a-release.apk
          elif [ "$RELEASE_SIGNING" = test ]; then
            KEYSTORE=app/debug.keystore
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_PASSWORD=android ANDROID_KEY_ALIAS=androiddebugkey
            APK_NAME=FluxPlayer-0.16.5-arm64-v8a-test-signed-release.apk
          else
            echo 'Unknown release signing mode' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "release/$APK_NAME" app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "release/$APK_NAME"
      - name: Verify Release APK and native libraries
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, zipfile
          apk = next(pathlib.Path('release').glob('*.apk'))
          badging = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/36.0.0/aapt', 'dump', 'badging', str(apk)], text=True)
          assert "name='com.fluxplayer.app'" in badging, 'Unexpected application ID'
          assert "versionCode='58'" in badging and "versionName='0.16.5'" in badging, 'Unexpected version'
          assert 'application-debuggable' not in badging, 'APK must be a non-debuggable Release build'
          with zipfile.ZipFile(apk) as archive:
              libraries = [name for name in archive.namelist() if name.startswith('lib/arm64-v8a/') and name.endswith('.so')]
              assert 'lib/arm64-v8a/libopenlist.so' in libraries, 'OpenList library is missing'
              for name in libraries:
                  assert archive.read(name)[:4] == b'\x7fELF', f'Invalid native library: {name}'
          print('Verified signed, non-debuggable Release APK with complete arm64 native libraries')
          PY
      - name: Save crash mapping and checksums
        run: |
          zip -j release/FluxPlayer-0.16.5-mapping.zip app/build/outputs/mapping/release/mapping.txt
          (cd release && sha256sum *.apk *-mapping.zip > SHA256SUMS.txt)
      - name: Upload Release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxplayer-0.16.5-arm64-release
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          修复听书首页切换网格/列表时的重复布局崩溃，保留滚动位置。

          Release 构建启用代码混淆和资源压缩，包含完整 arm64 原生库。
          附带混淆映射和 SHA-256 校验文件；网格/列表切换仍需设备复测。
          NOTES
          if [ "$RELEASE_SIGNING" = test ]; then
            printf '\n签名：使用仓库现有的公开调试证书签署 Release 优化测试版；不是正式发布签名。\n' >> "$RUNNER_TEMP/release-notes.md"
          else
            printf '\n签名：使用 GitHub Secrets 配置的正式发布证书。\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          TITLE='Flux Player 0.16.5 — 网格/列表切换修复（Release）'
          if [ "$RELEASE_SIGNING" = test ]; then
            TITLE='Flux Player 0.16.5 — 网格/列表切换修复（Release 优化测试版）'
          fi
          RELEASE_FLAGS=()
          if [ "$RELEASE_SIGNING" = test ]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            RELEASE_FLAGS+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release/*.apk release/*-mapping.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_FLAGS[@]}"
