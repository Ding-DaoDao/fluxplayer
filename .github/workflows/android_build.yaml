name: Build Flux Player APK

on:
  push:
    branches: [codex/project-updates, codex/fix-listening-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Test JDR engine, build APK and compile regression tests
        run: gradle --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.util.concurrent.ForkJoinPool.common.parallelism=4' -I .github/ci-repositories.gradle :core:jdr-engine:test :app:assembleDebug :feature:tingshu:assembleDebugAndroidTest
      - name: Verify APK native libraries
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/debug/app-arm64-v8a-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              libraries = [name for name in archive.namelist() if name.startswith('lib/arm64-v8a/') and name.endswith('.so')]
              assert 'lib/arm64-v8a/libopenlist.so' in libraries, 'OpenList library is missing'
              for name in libraries:
                  assert archive.read(name)[:4] == b'\x7fELF', f'Invalid native library: {name}'
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxplayer-grid-list-fix-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload JDR example
        uses: actions/upload-artifact@v4
        with:
          name: jdr-netdisk-demo
          path: docs/samples/jdr-netdisk-demo.jdr
          if-no-files-found: error
          retention-days: 30
