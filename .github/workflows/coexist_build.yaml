name: Publish Flux Player Coexist Test APK

on:
  push:
    branches: [codex/coexist-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluxplayer-coexist-test
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.16.5-coexist-test

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build optimized Release APK and test JDR engine
        run: gradle --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.util.concurrent.ForkJoinPool.common.parallelism=4' -I .github/ci-repositories.gradle :core:jdr-engine:test :app:assembleCoexist
      - name: Sign coexist test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_PASSWORD: android
        run: |
          mkdir -p release
          APK_NAME=FluxPlayer-0.16.5-arm64-v8a-coexist-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "release/$APK_NAME" app/build/outputs/apk/coexist/app-arm64-v8a-coexist-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "release/$APK_NAME"
      - name: Verify Release APK and native libraries
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, zipfile
          apk = next(pathlib.Path('release').glob('*.apk'))
          badging = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/36.0.0/aapt', 'dump', 'badging', str(apk)], text=True)
          assert "name='com.fluxplayer.app.test'" in badging, 'Unexpected application ID'
          assert "versionCode='58'" in badging and "versionName='0.16.5'" in badging, 'Unexpected version'
          assert 'Flux Player 测试版' in badging, 'Missing test application label'
          manifest = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/36.0.0/aapt', 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], text=True)
          assert 'com.fluxplayer.app.test.fileprovider' in manifest, 'FileProvider must use the coexist package'
          assert 'application-debuggable' not in badging, 'APK must be a non-debuggable Release build'
          with zipfile.ZipFile(apk) as archive:
              libraries = [name for name in archive.namelist() if name.startswith('lib/arm64-v8a/') and name.endswith('.so')]
              assert 'lib/arm64-v8a/libopenlist.so' in libraries, 'OpenList library is missing'
              for name in libraries:
                  assert archive.read(name)[:4] == b'\x7fELF', f'Invalid native library: {name}'
          print('Verified signed, non-debuggable Release APK with complete arm64 native libraries')
          PY
      - name: Save crash mapping and checksums
        run: |
          zip -j release/FluxPlayer-0.16.5-mapping.zip app/build/outputs/mapping/coexist/mapping.txt
          (cd release && sha256sum *.apk *-mapping.zip > SHA256SUMS.txt)
      - name: Upload Release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxplayer-0.16.5-arm64-coexist-test
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          修复听书首页切换网格/列表时的重复布局崩溃，保留滚动位置。

          Release 构建启用代码混淆和资源压缩，包含完整 arm64 原生库。
          附带混淆映射和 SHA-256 校验文件；网格/列表切换仍需设备复测。
          NOTES
          printf '\n共存测试版：包名 com.fluxplayer.app.test，应用名称 Flux Player 测试版，可与正式版同时安装。\n数据独立，需要重新导入源和配置登录凭证。使用公开调试证书签名。\n' >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release/*.apk release/*-mapping.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Flux Player 0.16.5 — 共存测试版' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
